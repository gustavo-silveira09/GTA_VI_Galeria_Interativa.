
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GTA VI - Vice City Experience</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>GRAND THEFT AUTO VI</h1>
        <p>Bem-vindo ao universo de Vice City</p>
    </header>

    <main>

        <section class="apresentacao">
            <h2>Explore GTA VI</h2>

            <p>
                Confira imagens, personagens, veículos e o trailer
                de um dos jogos mais aguardados do mundo.
            </p>
        </section>

        <section class="carrossel">

            <div class="area-midia">

                <img
                    id="imagem"
                    src="imagens/foto1.svg"
                    alt="Imagem de GTA VI"
                >

                <iframe
                    id="video"
                    src=""
                    title="Trailer de GTA VI"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen>
                </iframe>

            </div>

            <div class="informacoes">
                <h2 id="legenda">GTA VI - Protagonistas</h2>

                <p id="contador">1 / 5</p>
            </div>

            <div class="controles">

                <button id="anterior">❮ Anterior</button>

                <button id="iniciar">▶ Iniciar</button>

                <button id="pausar">⏸ Pausar</button>

                <button id="proxima">Próxima ❯</button>

            </div>

        </section>

    </main>

    <footer>
        <p>Projeto desenvolvido para fins educacionais.</p>
        <p>GTA VI - Vice City Experience</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
